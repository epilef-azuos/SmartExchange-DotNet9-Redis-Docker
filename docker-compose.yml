services:
  postgres:
    image: postgres:16-alpine
    container_name: smartexchange-postgres
    environment:
      POSTGRES_DB: smartexchange
      POSTGRES_USER: smartexchange
      POSTGRES_PASSWORD: smartexchange
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartexchange -d smartexchange"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartexchange-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartexchange-api
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__AuditDb: "Host=postgres;Port=5432;Database=smartexchange;Username=smartexchange;Password=smartexchange"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartexchange-postgres
    environment:
      POSTGRES_DB: smartexchange
      POSTGRES_USER: smartexchange
      POSTGRES_PASSWORD: smartexchange
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartexchange-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:

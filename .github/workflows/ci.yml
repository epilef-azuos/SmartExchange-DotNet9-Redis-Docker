name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartExchange.sln

      - name: Build
        run: dotnet build SmartExchange.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SmartExchange.sln --no-build --configuration Release --verbosity normal
